<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H7 & Tiba | Focus & Chat</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #0f0f0f;
            padding: 40px 50px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid #222;
            width: 350px;
            position: relative;
        }
        h1 { font-size: 20px; letter-spacing: 4px; color: #777; margin-bottom: 15px; font-weight: 400; }
        .timer { font-size: 80px; font-weight: 200; margin: 15px 0; letter-spacing: 6px; height: 90px; transition: color 0.3s ease; }
        .btn {
            background: transparent; color: #fff; border: 1px solid #444; padding: 12px 30px;
            font-size: 15px; border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            margin: 5px; letter-spacing: 1px; width: 100%;
        }
        .btn:hover { background: #fff; color: #000; }
        .btn.ready-active { background: #fff; color: #000; border-color: #fff; }
        .status-container { display: flex; justify-content: space-between; margin-top: 15px; font-size: 14px; color: #555; padding: 0 10px; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; background-color: #333; transition: all 0.3s ease; }
        .ready-dot { background-color: #00ff44; box-shadow: 0 0 10px #00ff44; }

        /* ستايل الجات */
        .chat-box {
            margin-top: 30px; border-top: 1px solid #222; padding-top: 20px; text-align: left;
        }
        #messages {
            height: 100px; overflow-y: auto; font-size: 13px; color: #aaa; margin-bottom: 10px;
            display: flex; flex-direction: column; gap: 5px; scroll-behavior: smooth;
        }
        .msg { padding: 4px 8px; border-radius: 6px; background: #1a1a1a; width: fit-content; word-wrap: break-word; }
        .msg-me { align-self: flex-end; background: #333; color: #fff; }
        .chat-input {
            width: 100%; background: #000; border: 1px solid #333; color: #fff;
            padding: 8px; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>H7 & TIBA</h1>
        
        <div id="roleSelection">
            <button class="btn" id="btnH7">I am H7</button>
            <button class="btn" id="btnTiba">I am Tiba</button>
        </div>

        <div id="mainStage" style="display: none;">
            <div class="timer" id="display">25:00</div>
            <button class="btn" id="readyBtn">Ready</button>
            <button class="btn" id="resetBtn" style="display: none; border-color: #600;">Reset</button>
            
            <div class="status-container">
                <div><span class="status-dot" id="dotH7"></span>H7</div>
                <div><span class="status-dot" id="dotTiba"></span>Tiba</div>
            </div>

            <div class="chat-box">
                <div id="messages"></div>
                <input type="text" id="chatInput" class="chat-input" placeholder="Type a message & press Enter...">
            </div>
        </div>
    </div>

    <script>
        // الكونفك مالتك ضفتله رابط الداتا بيس الناقص
        const firebaseConfig = {
            apiKey: "AIzaSyA1SCF0gfH-On_CyG8QHMujuyBYlAN6Ex4",
            authDomain: "h7-tiba-focus.firebaseapp.com",
            databaseURL: "https://h7-tiba-focus-default-rtdb.firebaseio.com", 
            projectId: "h7-tiba-focus",
            storageBucket: "h7-tiba-focus.firebasestorage.app",
            messagingSenderId: "145593860573",
            appId: "1:145593860573:web:9119f9786d0fff992cb634",
            measurementId: "G-HG74LBW6TJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myRole = ""; 
        let duration = 25 * 60 * 1000; 
        let localTimerInterval;

        const roleSelection = document.getElementById('roleSelection');
        const mainStage = document.getElementById('mainStage');
        const display = document.getElementById('display');
        const readyBtn = document.getElementById('readyBtn');
        const resetBtn = document.getElementById('resetBtn');
        const chatInput = document.getElementById('chatInput');
        const messagesDiv = document.getElementById('messages');

        document.getElementById('btnH7').onclick = () => selectRole('h7');
        document.getElementById('btnTiba').onclick = () => selectRole('tiba');

        function selectRole(role) {
            myRole = role;
            roleSelection.style.display = 'none';
            mainStage.style.display = 'block';
        }

        db.ref('session').on('value', (snapshot) => {
            const data = snapshot.val() || { h7Ready: false, tibaReady: false, startTime: 0 };
            document.getElementById('dotH7').className = data.h7Ready ? "status-dot ready-dot" : "status-dot";
            document.getElementById('dotTiba').className = data.tibaReady ? "status-dot ready-dot" : "status-dot";

            if (myRole && data[`${myRole}Ready`]) {
                readyBtn.textContent = "Waiting for partner...";
                readyBtn.classList.add("ready-active");
            } else {
                readyBtn.textContent = "Ready";
                readyBtn.classList.remove("ready-active");
            }

            if (data.h7Ready && data.tibaReady && data.startTime === 0) {
                if (myRole === 'h7') db.ref('session').update({ startTime: Date.now() + 3500 });
            }

            if (data.startTime > 0) {
                readyBtn.style.display = "none";
                resetBtn.style.display = "inline-block";
                startLocalEngine(data.startTime);
            } else {
                clearInterval(localTimerInterval);
                display.textContent = "25:00";
                readyBtn.style.display = "inline-block";
                resetBtn.style.display = "none";
                display.style.color = "#fff";
            }
        });

        readyBtn.onclick = () => {
            if (!myRole) return;
            document.getElementById(`dot${myRole === 'h7' ? 'H7' : 'Tiba'}`).className = "status-dot ready-dot";
            readyBtn.textContent = "Waiting...";
            db.ref('session').update({ [`${myRole}Ready`]: true });
        };

        resetBtn.onclick = () => {
            db.ref('session').set({ h7Ready: false, tibaReady: false, startTime: 0 });
            db.ref('messages').remove(); // يمسح الجات من يترست التحدي
        };

        chatInput.onkeydown = (e) => {
            if (e.key === 'Enter' && chatInput.value.trim() !== "") {
                const msg = chatInput.value;
                db.ref('messages').push({
                    user: myRole,
                    text: msg,
                    time: Date.now()
                });
                chatInput.value = "";
            }
        };

        db.ref('messages').limitToLast(15).on('value', (snapshot) => {
            messagesDiv.innerHTML = "";
            snapshot.forEach((child) => {
                const data = child.val();
                const div = document.createElement('div');
                div.className = `msg ${data.user === myRole ? 'msg-me' : ''}`;
                div.textContent = `${data.text}`;
                messagesDiv.appendChild(div);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        function startLocalEngine(targetStartTime) {
            clearInterval(localTimerInterval);
            localTimerInterval = setInterval(() => {
                const now = Date.now();
                if (now < targetStartTime) {
                    display.textContent = Math.ceil((targetStartTime - now) / 1000);
                    display.style.color = "#00ff44";
                } else {
                    display.style.color = "#fff";
                    const remaining = duration - (now - targetStartTime);
                    if (remaining <= 0) { display.textContent = "00:00"; clearInterval(localTimerInterval); return; }
                    const totalSec = Math.floor(remaining / 1000);
                    display.textContent = `${Math.floor(totalSec/60).toString().padStart(2,'0')}:${(totalSec%60).toString().padStart(2,'0')}`;
                }
            }, 100);
        }
    </script>
</body>
</html>
